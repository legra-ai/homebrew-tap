name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  formula-contract:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: test/formula-contract.sh
      - run: brew style Formula/legra.rb

  dependency-policy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: node scripts/lint-dependabot-policy.mjs
  dependency-validation:
    name: Dependency validation
    if: always() && github.event_name == 'pull_request'
    needs: ["formula-contract", "dependency-policy"]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: legra-ai/github-actions/.github/actions/require-ci-success@156c41f73b7331b9c70280a6b215a96c49a2d8fd
        with:
          results: ${{ toJSON(needs) }}
