name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]

jobs:
  update:
    name: Update Legra formula
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Update formula
        env:
          VERSION: ${{ github.event.client_payload.version }}
          DARWIN_AARCH64_SHA256: ${{ github.event.client_payload.darwin_aarch64_sha256 }}
          LINUX_X86_64_SHA256: ${{ github.event.client_payload.linux_x86_64_sha256 }}
          LINUX_AARCH64_SHA256: ${{ github.event.client_payload.linux_aarch64_sha256 }}
        run: |
          cat > Formula/legra.rb <<FORMULA
          class Legra < Formula
            desc "Peer-to-peer knowledge graph platform"
            homepage "https://legra.ai"
            version "${VERSION}"
            license "Proprietary"

            on_macos do
              depends_on arch: :arm64
              on_arm do
                url "https://releases.legra.ai/builds/${VERSION}/legra-${VERSION}-darwin-aarch64.tar.gz"
                sha256 "${DARWIN_AARCH64_SHA256}"
              end
            end

            on_linux do
              on_intel do
                url "https://releases.legra.ai/builds/${VERSION}/legra-${VERSION}-linux-x86_64.tar.gz"
                sha256 "${LINUX_X86_64_SHA256}"
              end
              on_arm do
                url "https://releases.legra.ai/builds/${VERSION}/legra-${VERSION}-linux-aarch64.tar.gz"
                sha256 "${LINUX_AARCH64_SHA256}"
              end
            end

            def install
              bin.install "legra"
              bin.install "legra-host"
              bin.install "legra-gateway"
              bin.install "legra-custodian"
              bin.install "legra-worker"
              bin.install "legra-licensor"
            end

            def caveats
              <<~EOS
                To install and start Legra's per-user services:
                  legra install --all --user
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/legra --version")
              %w[legra-host legra-gateway legra-custodian legra-worker legra-licensor].each do |executable|
                assert_predicate bin/executable, :executable?
              end
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc indentation
          sed -i 's/^          //' Formula/legra.rb

          test/formula-contract.sh
          brew style Formula/legra.rb

          echo "Updated formula to version ${VERSION}"
          echo "  darwin-aarch64 sha256: ${DARWIN_AARCH64_SHA256}"
          echo "  linux-x86_64 sha256:   ${LINUX_X86_64_SHA256}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/legra.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(formula): update to ${{ github.event.client_payload.version }}"
          git push
