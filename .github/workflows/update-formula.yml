name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]

jobs:
  update:
    name: Update wwkg formula
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Update formula
        env:
          VERSION: ${{ github.event.client_payload.version }}
          DARWIN_AARCH64_SHA256: ${{ github.event.client_payload.darwin_aarch64_sha256 }}
          LINUX_X86_64_SHA256: ${{ github.event.client_payload.linux_x86_64_sha256 }}
          LINUX_AARCH64_SHA256: ${{ github.event.client_payload.linux_aarch64_sha256 }}
        run: |
          cat > Formula/wwkg.rb <<FORMULA
          class Wwkg < Formula
            desc "World Wide Knowledge Graph — peer-to-peer graph database"
            homepage "https://wwkg.io"
            version "${VERSION}"
            license "Proprietary"

            on_macos do
              # Apple Silicon only — Intel Macs use Rosetta 2
              url "https://releases.wwkg.io/builds/${VERSION}/wwkg-${VERSION}-darwin-aarch64.tar.gz"
              sha256 "${DARWIN_AARCH64_SHA256}"
            end

            on_linux do
              on_intel do
                url "https://releases.wwkg.io/builds/${VERSION}/wwkg-${VERSION}-linux-x86_64.tar.gz"
                sha256 "${LINUX_X86_64_SHA256}"
              end
              on_arm do
                url "https://releases.wwkg.io/builds/${VERSION}/wwkg-${VERSION}-linux-aarch64.tar.gz"
                sha256 "${LINUX_AARCH64_SHA256}"
              end
            end

            def install
              bin.install "wwkg"
              bin.install "wwkg-node"
              bin.install "wwkg-gateway"
            end

            def post_install
              system bin/"wwkg", "install", "--all", "--user", "--no-start"
            end

            def caveats
              <<~EOS
                To start the WWKG node and gateway:
                  wwkg node start
                  wwkg gateway start
              EOS
            end

            test do
              assert_match "WWKG", shell_output("#{bin}/wwkg --help")
              assert_match version.to_s.split(".")[0..2].join("."),
                           shell_output("#{bin}/wwkg-node version")
              assert_match version.to_s.split(".")[0..2].join("."),
                           shell_output("#{bin}/wwkg-gateway version")
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc indentation
          sed -i 's/^          //' Formula/wwkg.rb

          echo "Updated formula to version ${VERSION}"
          echo "  darwin-aarch64 sha256: ${DARWIN_AARCH64_SHA256}"
          echo "  linux-x86_64 sha256:   ${LINUX_X86_64_SHA256}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/wwkg.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(formula): update to ${{ github.event.client_payload.version }}"
          git push
